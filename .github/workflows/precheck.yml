name: Precheck

# Runs on precheck/* branches, ahead of a release. The SDKs are packaged with
# the workflow of the release and osxcross is built with the oldest, a middle
# and the newest of them, so the build covers SDKs this release would add.
# Apple Clang comes from the latest published release; a precheck of the
# Apple Clang build is in precheck-clang.yml.

on:
  push:
    branches:
      - "precheck/**"

env:
  PREVIOUS_RELEASE: v0.2.8

jobs:
  package_sdks:
    uses: ./.github/workflows/sdk.yml

  select_sdks:
    name: Select SDKs
    runs-on: ubuntu-latest
    needs: package_sdks
    outputs:
      combinations: ${{ steps.select.outputs.combinations }}
    steps:
      - name: Select the oldest, a middle and the newest SDK
        id: select
        env:
          SDK_VERSIONS: ${{ needs.package_sdks.outputs.SDK_VERSIONS }}
        run: |
          set -e
          sorted=$(echo "$SDK_VERSIONS" | jq -r '.[]' | sort -t - -k 1,1n -k 2,2n)
          count=$(echo "$sorted" | wc -l)
          oldest=$(echo "$sorted" | head -n 1)
          middle=$(echo "$sorted" | sed -n "$(( count > 1 ? count / 2 : 1 ))p")
          newest=$(echo "$sorted" | tail -n 1)
          combinations=$(jq -nc --arg oldest "$oldest" --arg middle "$middle" --arg newest "$newest" '
            [
              { sdk: $oldest, ubuntu: "24.04", arch: "x86_64" },
              { sdk: $middle, ubuntu: "26.04", arch: "aarch64" },
              { sdk: $newest, ubuntu: "20.04", arch: "x86_64" },
              { sdk: $newest, ubuntu: "24.04", arch: "aarch64" }
            ]')
          echo "$combinations"
          echo "combinations=$combinations" >> "$GITHUB_OUTPUT"

  build_osxcross:
    name: Build osxcross (${{ matrix.combination.sdk }}, ${{ matrix.combination.ubuntu }}, ${{ matrix.combination.arch }})
    needs: select_sdks
    strategy:
      fail-fast: false
      matrix:
        combination: ${{ fromJSON(needs.select_sdks.outputs.combinations) }}
    runs-on: ${{ matrix.combination.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download SDK
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.combination.sdk }}
          path: tarballs

      - name: Create build script
        run: |
          cat > build_script.sh << 'EOF'
          #!/bin/bash
          set -e

          echo "Building osxcross for Ubuntu $1 with SDK $2"
          echo "Architecture: $(uname -m)"

          # Update package list and install dependencies
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y \
            curl \
            wget \
            make \
            cmake \
            unzip \
            git \
            patch \
            python3 \
            libssl-dev \
            liblzma-dev \
            libxml2-dev \
            xz-utils \
            bzip2 \
            cpio \
            zlib1g-dev \
            llvm-dev \
            uuid-dev \
            lsb-release \
            software-properties-common \
            gnupg \
            build-essential \
            ninja-build

          export TARGET_DIR=/usr/local/osxcross
          CLANG_DIR=$TARGET_DIR/clang
          mkdir -p $CLANG_DIR

          # Apple Clang from the latest published release
          if [ "$(uname -m)" = "x86_64" ] || [ "$(uname -m)" = "amd64" ]; then
            ARCH=x86_64
          elif [ "$(uname -m)" = "aarch64" ] || [ "$(uname -m)" = "arm64" ]; then
            ARCH=aarch64
          else
            echo "Unsupported architecture: $(uname -m)"
            exit 1
          fi
          curl -fsSL --retry 5 -o /tmp/apple-clang.tar.gz \
            $3/apple-clang-23-linux-$ARCH-gnu-ubuntu-$1.tar.gz
          tar -xzf /tmp/apple-clang.tar.gz -C $CLANG_DIR
          export PATH=$CLANG_DIR/bin:$PATH

          # Download and install CMake
          mkdir -p /cmake
          if [ "$(uname -m)" = "x86_64" ] || [ "$(uname -m)" = "amd64" ]; then
            curl -sSL https://github.com/Kitware/CMake/releases/download/v3.31.8/cmake-3.31.8-linux-x86_64.tar.gz | tar -xz -C /cmake --strip-components=1
          elif [ "$(uname -m)" = "aarch64" ] || [ "$(uname -m)" = "arm64" ]; then
            curl -sSL https://github.com/Kitware/CMake/releases/download/v3.31.8/cmake-3.31.8-linux-aarch64.tar.gz | tar -xz -C /cmake --strip-components=1
          else
            echo "Unsupported architecture: $(uname -m)"
            exit 1
          fi
          export PATH=/cmake/bin:$PATH

          # Build osxcross
          export IPHONEOS_DEPLOYMENT_TARGET=5.0
          UNATTENDED=1 SDK_VERSION="$(echo $2 | sed 's/-/./g')" JOBS=$(nproc) bash build.sh

          # Smoke test: compile and link a program for two targets, the way the
          # README uses the toolchain (bin directory first in PATH)
          export PATH=$TARGET_DIR/bin:$PATH
          printf '#include <stdio.h>\nint main(void){puts("ok");return 0;}\n' > /tmp/hello.c
          for cc in o64-clang arm64-clang; do
            $cc /tmp/hello.c -o /tmp/hello-$cc
            otool -L /tmp/hello-$cc
          done
          ls $TARGET_DIR/bin | wc -l
          o64-clang --version | head -2
          EOF

          chmod +x build_script.sh

      - name: Build osxcross
        run: |
          for i in 1 2 3 4 5; do
            docker pull 'ubuntu:${{ matrix.combination.ubuntu }}' && break
            echo "docker pull failed, retry $i in 60s"; sleep 60
          done
          docker run --rm \
            --volume "${PWD}:/osxcross" \
            --workdir /osxcross \
            ubuntu:${{ matrix.combination.ubuntu }} \
            /bin/bash -c "/osxcross/build_script.sh '${{ matrix.combination.ubuntu }}' '${{ matrix.combination.sdk }}' 'https://github.com/${{ github.repository }}/releases/download/${{ env.PREVIOUS_RELEASE }}'"
