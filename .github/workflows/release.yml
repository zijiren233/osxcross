name: Release osxcross

on:
  push:
    tags:
      - "v*"

jobs:
  package_sdks:
    uses: ./.github/workflows/sdk.yml

  release_sdks:
    name: Release SDKs
    runs-on: ubuntu-latest
    needs: package_sdks
    steps:
      - uses: actions/checkout@v4

      - name: Download SDKs
        id: download_sdks
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            execSync('npm install @actions/artifact');
            const { DefaultArtifactClient } = require('@actions/artifact');
            const artifact = new DefaultArtifactClient();
            const fs = require('fs');

            const allArtifacts = await artifact.listArtifacts();
            const sdkArtifacts = allArtifacts.artifacts.filter(a => !a.name.startsWith('sdk-'));
            for (const sdkArtifact of sdkArtifacts) {
              console.log('download', sdkArtifact);
              await artifact.downloadArtifact(sdkArtifact.id, {
                path: 'tarballs'
              });
            }

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          append_body: false
          fail_on_unmatched_files: true
          files: |
            tarballs/*

  build_osxcross:
    name: Build osxcross
    strategy:
      fail-fast: false
      matrix:
        sdk_versions: ${{ fromJSON(needs.package_sdks.outputs.SDK_VERSIONS) }}
        ubuntu_version:
          - 20.04
          - 22.04
          - 24.04
        runs-on:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    needs:
      - package_sdks
      - release_sdks
    steps:
      - uses: actions/checkout@v4

      - name: Download SDK
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sdk_versions }}
          path: tarballs

      - name: Create build script
        run: |
          cat > build_script.sh << 'EOF'
          #!/bin/bash
          set -e

          echo "Building osxcross for Ubuntu $1 with SDK $2"
          echo "Architecture: $(uname -m)"

          # Update package list and install dependencies
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y \
            curl \
            wget \
            make \
            cmake \
            git \
            patch \
            python3 \
            libssl-dev \
            lzma-dev \
            libxml2-dev \
            xz-utils \
            bzip2 \
            cpio \
            zlib1g-dev \
            llvm-dev \
            uuid-dev \
            lsb-release \
            software-properties-common \
            gnupg

          # Install LLVM/Clang
          bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)"
          update-alternatives --install /usr/bin/clang clang "$(ls /usr/bin/clang-[21]*)" 100
          update-alternatives --install /usr/bin/clang++ clang++ "$(ls /usr/bin/clang++-[21*)" 100

          # Download and install CMake
          mkdir -p /cmake
          if [ "$(uname -m)" = "x86_64" ] || [ "$(uname -m)" = "amd64" ]; then
            curl -sSL https://github.com/Kitware/CMake/releases/download/v3.31.8/cmake-3.31.8-linux-x86_64.tar.gz | tar -xz -C /cmake --strip-components=1
          elif [ "$(uname -m)" = "aarch64" ] || [ "$(uname -m)" = "arm64" ]; then
            curl -sSL https://github.com/Kitware/CMake/releases/download/v3.31.8/cmake-3.31.8-linux-aarch64.tar.gz | tar -xz -C /cmake --strip-components=1
          else
            echo "Unsupported architecture: $(uname -m)"
            exit 1
          fi
          export PATH=/cmake/bin:$PATH

          # Build osxcross
          export TARGET_DIR=/usr/local/osxcross
          export IPHONEOS_DEPLOYMENT_TARGET=5.0
          UNATTENDED=1 SDK_VERSION="$(echo $2 | sed 's/-/./g')" JOBS=$(nproc) bash build.sh

          # Create distribution package
          mkdir -p dist
          if [ "$(uname -m)" = "x86_64" ] || [ "$(uname -m)" = "amd64" ]; then
            tar -zcf dist/osxcross-$2-linux-x86_64-gnu-ubuntu-$1.tar.gz -C $TARGET_DIR .
          elif [ "$(uname -m)" = "aarch64" ] || [ "$(uname -m)" = "arm64" ]; then
            tar -zcf dist/osxcross-$2-linux-aarch64-gnu-ubuntu-$1.tar.gz -C $TARGET_DIR .
          else
            echo "Unsupported architecture: $(uname -m)"
            exit 1
          fi
          EOF

          chmod +x build_script.sh

      - name: Build osxcross
        run: |
          docker run --rm \
            --volume "${PWD}:/osxcross" \
            --workdir /osxcross \
            ubuntu:${{ matrix.ubuntu_version }} \
            /bin/bash -c "/osxcross/build_script.sh '${{ matrix.ubuntu_version }}' '${{ matrix.sdk_versions }}'"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          append_body: false
          fail_on_unmatched_files: true
          files: |
            dist/*
